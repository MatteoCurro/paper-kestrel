name: Maintenance pass

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: "Specification file committed under orders/"
        required: true
        default: "orders/current.md"

permissions:
  contents: read
  id-token: write

concurrency:
  group: paper-kestrel-agent
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ secrets.CREW_GITHUB_TOKEN }}
      TARGET_REPO_A: ${{ secrets.TARGET_REPO_A }}
      TARGET_REPO_B: ${{ secrets.TARGET_REPO_B }}
      MODEL_CORE: ${{ vars.MODEL_CORE || 'openai/gpt-6.1-sol' }}
      MODEL_LIGHT: ${{ vars.MODEL_LIGHT || 'openai/gpt-6-luna' }}
      MAX_REPAIR_ROUNDS: "1"
      MAX_RPM: "30"
      MAX_RUN_COST_USD: "0.75"
      HARD_RUN_COST_USD: "0.75"
      RUN_STATE_DB: ${{ github.workspace }}/output/run-state.sqlite3
      RUN_STATE_ID: ${{ github.run_id }}:${{ github.run_attempt }}
      MILESTONE_KEY: ${{ vars.MILESTONE_KEY }}
      MODEL_PRICING_JSON: ${{ secrets.MODEL_PRICING_JSON }}
      CREW_BUDGET_URL: "https://xiiexzvuvzsiacbmwras.supabase.co/functions/v1/crew-budget"
      CREW_BUDGET_AUDIENCE: "crew-budget-supabase"
      JARVIS_INGEST_URL: "https://xiiexzvuvzsiacbmwras.supabase.co/functions/v1/jarvis-ingest"
      JARVIS_AUDIENCE: "jarvis-supabase"
      JARVIS_SPEC_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.spec_path || 'orders/current.md' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Migration safety gate (non-bypassable)
        shell: bash
        run: |
          echo "CrewAI V2 is not approved for paid or repository-mutating execution."
          echo "Run the offline tests via the dedicated CI-only workflow."
          exit 78

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY"; exit 2; }
          test -n "$GH_TOKEN" || { echo "Missing CREW_GITHUB_TOKEN"; exit 2; }
          test -n "$TARGET_REPO_A" || { echo "Missing TARGET_REPO_A"; exit 2; }
          test -n "$TARGET_REPO_B" || { echo "Missing TARGET_REPO_B"; exit 2; }
          case "$JARVIS_SPEC_PATH" in
            orders/*.md) ;;
            *) echo "spec_path must be under orders/ and end in .md"; exit 2 ;;
          esac
          test -f "$JARVIS_SPEC_PATH" || { echo "Specification not found"; exit 2; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install orchestrator
        run: python -m pip install --disable-pip-version-check -e .

      - name: Validate orchestrator syntax
        run: python -m py_compile src/paper_kestrel/*.py

      - name: Test transactional state (offline)
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Clone split workspaces
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git >/dev/null 2>&1
          gh repo clone "$TARGET_REPO_A" repo-a -- --quiet
          gh repo clone "$TARGET_REPO_B" repo-b -- --quiet
          python -m paper_kestrel.split assemble --a repo-a --b repo-b --work work
          cd work
          git init -q
          git config user.name "paper-kestrel"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf "node_modules/\n" >> .git/info/exclude
          git add -A
          git commit -qm baseline

      - name: Install project test dependencies
        working-directory: work
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Run coordinated crew
        id: crew
        shell: bash
        run: |
          set +e
          paper-kestrel \
            --spec "$JARVIS_SPEC_PATH" \
            --workspace work \
            --report-dir output
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture candidate evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          if [[ -d work/.git ]]; then
            git -C work add -N -- . >/dev/null 2>&1 || true
            git -C work status --short > output/candidate-status.txt || true
            git -C work diff --name-only -- . > output/candidate-files.txt || true
            git -C work diff --stat -- . > output/candidate-stat.txt || true
            git -C work diff --binary -- . > output/candidate.patch || true
          fi

      - name: Split candidate back to source repositories
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d work/.git && -d repo-a/.git && -d repo-b/.git ]]; then
            python -m paper_kestrel.split sync --work work --a repo-a --b repo-b
          fi

      - name: Open candidate pull requests
        id: prs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          crew_rc="${{ steps.crew.outputs.exit_code || '1' }}"
          opened=0
          for pair in "repo-a:$TARGET_REPO_A" "repo-b:$TARGET_REPO_B"; do
            dir="${pair%%:*}"
            target="${pair#*:}"
            if [[ ! -d "$dir/.git" || -z "$(git -C "$dir" status --porcelain)" ]]; then
              echo "No candidate changes for $target."
              continue
            fi
            git -C "$dir" checkout -qb "$branch"
            git -C "$dir" config user.name "paper-kestrel"
            git -C "$dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$dir" add -A
            git -C "$dir" commit -qm "Maintenance pass $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            git -C "$dir" push -q -u origin "$branch"

            body_file="output/agent-report.md"
            if [[ ! -f "$body_file" ]]; then
              printf '%s\n' "# Automation report" "" "Report unavailable; inspect candidate patch artifact." > "$body_file"
            fi
            {
              printf '\n## Candidate preservation\n\n'
              printf 'Crew exit code: `%s`\n\n' "$crew_rc"
              printf 'This PR preserves the candidate generated by the run. No automatic merge or deploy.\n'
              if [[ "$crew_rc" != "0" ]]; then
                printf '\n**Status: BLOCKED / DRAFT.** QA or deterministic validation did not approve this candidate.\n'
              fi
            } >> "$body_file"

            if [[ "$crew_rc" == "0" ]]; then
              title="Maintenance pass $GITHUB_RUN_ID"
              pr_url="$(gh pr create --repo "$target" --base main --head "$branch" --title "$title" --body-file "$body_file")"
              event_message="PR pronta per review su $target"
            else
              title="[BLOCKED] Maintenance pass $GITHUB_RUN_ID"
              pr_url="$(gh pr create --draft --repo "$target" --base main --head "$branch" --title "$title" --body-file "$body_file")"
              event_message="Draft PR bloccata preservata su $target"
            fi

            python -m paper_kestrel.jarvis \
              --event-type "pr.opened" \
              --message "$event_message" \
              --status "running" \
              --phase "delivery" \
              --spec-path "$JARVIS_SPEC_PATH" \
              --pr-url "$pr_url" \
              --event-key "pr:$target:$GITHUB_RUN_ATTEMPT"
            opened=1
          done
          echo "opened=$opened" >> "$GITHUB_OUTPUT"

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-report-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish final Jarvis state
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          crew_rc="${{ steps.crew.outputs.exit_code || '1' }}"
          status="${{ job.status }}"
          if [[ "$crew_rc" != "0" ]]; then
            status="failure"
          fi
          phase="done"
          message="Workflow completato con stato: $status · crew_exit=$crew_rc"
          python -m paper_kestrel.jarvis \
            --event-type "run.completed" \
            --message "$message" \
            --status "$status" \
            --phase "$phase" \
            --spec-path "$JARVIS_SPEC_PATH" \
            --finished \
            --event-key "workflow:final"

      - name: Enforce crew result
        if: always()
        shell: bash
        run: |
          rc="${{ steps.crew.outputs.exit_code || '1' }}"
          if [[ "$rc" != "0" ]]; then
            echo "Crew did not approve the candidate (exit $rc). Candidate evidence and draft PR were preserved."
            exit "$rc"
          fi
