# Registered maintenance workflow
name: Maintenance pass

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: "Specification file committed under orders/"
        required: true
        default: "orders/current.md"
  push:
    branches:
      - main
    paths:
      - "orders/current.md"

permissions:
  contents: read
  id-token: write

concurrency:
  group: paper-kestrel-agent
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ secrets.CREW_GITHUB_TOKEN }}
      TARGET_REPO_A: ${{ secrets.TARGET_REPO_A }}
      TARGET_REPO_B: ${{ secrets.TARGET_REPO_B }}
      MODEL_CORE: ${{ vars.MODEL_CORE || 'openai/gpt-6.1-sol' }}
      MODEL_LIGHT: ${{ vars.MODEL_LIGHT || 'openai/gpt-6-luna' }}
      MAX_REPAIR_ROUNDS: "3"
      MAX_RPM: "30"
      MAX_RUN_COST_USD: "1.25"
      HARD_RUN_COST_USD: "1.50"
      JARVIS_INGEST_URL: "https://xiiexzvuvzsiacbmwras.supabase.co/functions/v1/jarvis-ingest"
      JARVIS_AUDIENCE: "jarvis-supabase"
      JARVIS_SPEC_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.spec_path || 'orders/current.md' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY"; exit 2; }
          test -n "$GH_TOKEN" || { echo "Missing CREW_GITHUB_TOKEN"; exit 2; }
          test -n "$TARGET_REPO_A" || { echo "Missing TARGET_REPO_A"; exit 2; }
          test -n "$TARGET_REPO_B" || { echo "Missing TARGET_REPO_B"; exit 2; }
          case "$JARVIS_SPEC_PATH" in
            orders/*.md) ;;
            *) echo "spec_path must be under orders/ and end in .md"; exit 2 ;;
          esac
          test -f "$JARVIS_SPEC_PATH" || { echo "Specification not found"; exit 2; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install orchestrator
        run: python -m pip install --disable-pip-version-check -e .

      - name: Validate orchestrator syntax
        run: python -m py_compile src/paper_kestrel/*.py

      - name: Clone split workspaces
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git >/dev/null 2>&1
          gh repo clone "$TARGET_REPO_A" repo-a -- --quiet
          gh repo clone "$TARGET_REPO_B" repo-b -- --quiet
          python -m paper_kestrel.split assemble --a repo-a --b repo-b --work work
          cd work
          git init -q
          git config user.name "paper-kestrel"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf "node_modules/\n" >> .git/info/exclude
          git add -A
          git commit -qm baseline

      - name: Install project test dependencies
        working-directory: work
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Run coordinated crew
        run: |
          paper-kestrel             --spec "$JARVIS_SPEC_PATH"             --workspace work             --report-dir output

      - name: Split changes back to source repositories
        run: python -m paper_kestrel.split sync --work work --a repo-a --b repo-b

      - name: Open review pull requests
        id: prs
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/run-$GITHUB_RUN_ID"
          opened=0
          for pair in "repo-a:$TARGET_REPO_A" "repo-b:$TARGET_REPO_B"; do
            dir="${pair%%:*}"
            target="${pair#*:}"
            if [[ -z "$(git -C "$dir" status --porcelain)" ]]; then
              echo "No changes for one target."
              continue
            fi
            git -C "$dir" checkout -qb "$branch"
            git -C "$dir" config user.name "paper-kestrel"
            git -C "$dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$dir" add -A
            git -C "$dir" commit -qm "Maintenance pass $GITHUB_RUN_ID"
            git -C "$dir" push -q -u origin "$branch"
            body_file="output/agent-report.md"
            if [[ ! -f "$body_file" ]]; then
              printf '%s\n' "Automated candidate. No automatic merge." > "$body_file"
            fi
            printf '\n%s\n' "Automated candidate. No automatic merge or deploy." >> "$body_file"
            pr_url="$(gh pr create --repo "$target" --base main --head "$branch" --title "Maintenance pass $GITHUB_RUN_ID" --body-file "$body_file")"
            python -m paper_kestrel.jarvis \
              --event-type "pr.opened" \
              --message "PR aperta su $target" \
              --status "running" \
              --phase "delivery" \
              --spec-path "$JARVIS_SPEC_PATH" \
              --pr-url "$pr_url" \
              --event-key "pr:$target"
            opened=1
          done
          echo "opened=$opened" >> "$GITHUB_OUTPUT"

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-report-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish final Jarvis state
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          status="${{ job.status }}"
          phase="done"
          message="Workflow completato con stato: $status"
          python -m paper_kestrel.jarvis \
            --event-type "run.completed" \
            --message "$message" \
            --status "$status" \
            --phase "$phase" \
            --spec-path "$JARVIS_SPEC_PATH" \
            --finished \
            --event-key "workflow:final"
