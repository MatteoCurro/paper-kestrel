name: CrewAI V2 isolated PR audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/paper_kestrel/**'
      - 'tests/**'
      - 'edge/crew-budget/**'
      - 'WIRE-BUDGET-AUDIT.md'
      - '.github/workflows/crewai-offline-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == 'MatteoCurro/paper-kestrel' && github.head_ref == 'infra/transactional-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm no paid API credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${JARVIS_INGEST_URL:-}"
      - name: Install pinned orchestration dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile and run offline regression suite
        env:
          OPENAI_API_KEY: ''
          GH_TOKEN: ''
          JARVIS_INGEST_URL: ''
          MODEL_PRICING_JSON: ''
          CREW_BUDGET_URL: ''
        run: |
          python -m compileall -q src/paper_kestrel tests
          python -m unittest discover -s tests -p 'test_*.py' -v
