name: Jarvis TSAND ingest smoke

on:
  push:
    branches:
      - infra/transactional-v2
    paths:
      - '.github/workflows/jarvis-tsand-ingest-smoke.yml'

permissions:
  contents: read
  id-token: write

jobs:
  verify-preview:
    if: github.repository == 'MatteoCurro/paper-kestrel' && github.ref == 'refs/heads/infra/transactional-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GitHub OIDC to Jarvis TSAND preview (no models or deployments)
        shell: bash
        env:
          JARVIS_INGEST_PREVIEW: https://xiiexzvuvzsiacbmwras.supabase.co/functions/v1/jarvis-ingest-preview
          JARVIS_WEB_PREVIEW: https://xiiexzvuvzsiacbmwras.supabase.co/functions/v1/jarvis-preview
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          from pathlib import Path
          assert os.environ["GITHUB_REPOSITORY"] == "MatteoCurro/paper-kestrel"
          assert os.environ["GITHUB_REF"] == "refs/heads/infra/transactional-v2"
          run_id = int(os.environ["GITHUB_RUN_ID"])
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          base = os.environ["JARVIS_INGEST_PREVIEW"]
          frontend = os.environ["JARVIS_WEB_PREVIEW"]
          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          sep = "&" if "?" in oidc_url else "?"
          oidc_url += sep + urllib.parse.urlencode({"audience": "jarvis-supabase"})
          auth = urllib.request.Request(oidc_url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(auth, timeout=12) as result:
              token = json.loads(result.read())["value"]
          def call(payload, wanted=200, signed=True):
              headers = {"Content-Type": "application/json"}
              if signed: headers["Authorization"] = "Bearer " + token
              req = urllib.request.Request(base,method="POST",
                  data=json.dumps(payload).encode(),headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=15) as resp:
                      status,body = resp.status,json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  status = e.code
                  body = json.loads(e.read().decode())
              assert status == wanted, "Jarvis preview HTTP %s instead of %s: %s" % (
                  status,wanted,json.dumps(body)[:400])
              return body
          with urllib.request.urlopen(frontend,timeout=15) as resp:
              text = resp.read().decode()
              assert resp.status == 200
              for marker in ("Jarvis","totalTokens(", "runIsStale(", 'id="notice"'):
                  assert marker in text, "Missing preview UI marker " + marker
          print("UI preview: 200, source markers present")
          call({"status":"in_progress","phase":"planning","message":"unauthenticated",
                "event_key":"smoke:unauth"},401,False)
          call({"github_run_id":run_id+1,"run_attempt":attempt,
                "event_key":"smoke:mismatch","message":"Wrong run claim",
                "status":"in_progress","phase":"setup"},403)
          call({"event_key":"smoke:started","event_type":"run_started",
                "message":"TSAND smoke started","status":"in_progress",
                "phase":"implementation","input_tokens":100,"output_tokens":20,
                "active_agents":["TSAND QA"]})
          call({"event_key":"smoke:finished","event_type":"run_completed",
                "message":"TSAND smoke completed","status":"success",
                "phase":"done","input_tokens":180,"output_tokens":40,
                "cached_tokens":30,"reasoning_tokens":8,"active_agents":[]})
          call({"event_key":"smoke:late","event_type":"agent_progress",
                "message":"Intentionally delayed event after successful completion",
                "status":"in_progress","phase":"planning",
                "input_tokens":10,"output_tokens":2,"active_agents":["old agent"]})
          call({"event_key":"smoke:finished","event_type":"run_completed",
                "message":"TSAND smoke completed","status":"success",
                "phase":"done","input_tokens":180,"output_tokens":40})
          report = {
              "mode":"TSAND-ONLY-OIDC-SMOKE","github_run_id":run_id,
              "run_attempt":attempt,"expected_status":"success",
              "expected_phase":"done","expected_input_tokens":180,
              "expected_output_tokens":40,"expected_event_keys":3,
              "invalid_body_ids_rejected":True,"unauthorized_rejected":True,
              "source_read_only":True,"model_calls":0,"deployments":0}
          Path("jarvis-tsand-smoke.json").write_text(json.dumps(report,indent=2))
          print("OIDC Jarvis preview smoke passed: authorization, valid lifecycle, late event, idempotency")
          PY
      - name: Save nonsensitive TSAND smoke evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ingest-tsand-smoke
          path: jarvis-tsand-smoke.json
          retention-days: 7
