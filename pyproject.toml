[project]
name = "paper-kestrel"
version = "0.1.0"
description = "Repository maintenance workflow"
requires-python = ">=3.11,<3.14"
dependencies = [
  "crewai==1.15.23",
  "pydantic>=2.11,<2.13"
]

[project.scripts]
paper-kestrel = "paper_kestrel.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_kestrel"]
